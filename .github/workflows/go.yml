name: Go

on:
  push:
    branches: ["master", "release/*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - name: Set up minimum Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test minimum Go
        run: go test -race ./...

      - name: Set up stable Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

      - name: Verify module files and formatting
        run: make tidy-check fmt-check

      - name: Build
        run: go build -v ./...

      - name: Test stable Go
        run: go test -race ./...
